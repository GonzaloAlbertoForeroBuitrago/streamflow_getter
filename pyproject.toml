[project]
name = "streamflow-getter"
version = "0.0.1"
description = "Download streamflow time series from NWM, NRDS and GEOGLOWS output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "dask>=2026.8.0",
    "pandas>=3.0.6",
    "s3fs>=2026.9.0",
    "xarray>=2026.9.0",
    "zarr>=3.1.6",
]

[project.optional-dependencies]
plot = [
    "plotly",
]

notebook = [
    "plotly",
    "ipython",
    "ipykernel",
    "ipywidgets",
    "ipyleaflet",
    "anywidget",
    "psutil",
]

spatial = [
    "geopandas",
    "pyogrio",
    "pyproj",
    "shapely",
]

parquet = [
    "pyarrow",
]

operational = [
    "h5netcdf",
    "h5py",
]


[project.scripts]
streamflow-getter = "streamflow_getter.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamflow_getter"]


[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
